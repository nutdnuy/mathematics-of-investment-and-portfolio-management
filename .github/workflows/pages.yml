name: Publish book reader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Build full reader and validate local references
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - name: Point migrated book pages to the main Library domain
        run: python3 scripts/set-library-canonicals.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
